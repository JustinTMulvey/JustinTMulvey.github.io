<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  try {
    var stored = localStorage.getItem('theme');
    var theme = stored || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
</script>
<title>Justin T Mulvey — Research</title>
<meta name="description" content="Connecting structure, properties and performance through microscopy, computer vision, and data science.">
<link rel="icon" href="assets/img/site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/cards.css">
<link rel="stylesheet" href="assets/css/mobile.css">
<link rel="canonical" href="https://justintmulvey.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Justin T Mulvey">
<meta property="og:url" content="https://justintmulvey.github.io/">

<meta property="og:description" content="Connecting structure, properties and performance through microscopy, computer vision, and data science.">

<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap site-header__inner">
    <div class="site-header__brand">
      <a class="site-header__name" href="index.html">Justin T Mulvey</a>
      <div class="theme-switch">
        <span class="theme-switch__label theme-switch__label--light">Light</span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="true">
          <span class="theme-toggle__thumb"></span>
        </button>
        <span class="theme-switch__label theme-switch__label--dark">Dark</span>
      </div>
    </div>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html" aria-current="page">Research</a>
      <a href="publications.html">Publications</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main id="main">

  <section class="hero hero--photo">
    <div class="wrap">
      <img class="hero__photo" src="assets/img/site/headshot.jpg" alt="Portrait of Justin T Mulvey" width="800" height="800">
      <h1 class="hero__title">Justin T Mulvey, PhD</h1>
      <p class="hero__tagline">
        Connecting structure, properties and performance through microscopy,
        computer vision, and data science.
      </p>
    </div>
  </section>

  <div class="wrap">
    <div id="cards" class="cards" aria-live="polite">
      <!-- Starts hidden. render-cards.js reveals it only if the manifest is
           still loading after one second, so a fast load never flashes a
           spinner on its way past. -->
      <p id="cards-loading" class="cards__loading" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span class="cards__loading-text">Loading research…</span>
      </p>
    </div>
  </div>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p>&copy; <span id="year"></span> Justin T Mulvey</p>
    <nav class="site-footer__links" id="footer-links" aria-label="Elsewhere"></nav>
  </div>
</footer>

<script src="assets/js/lazy-load.js"></script>
<script src="assets/js/card-gallery.js"></script>

<script src="assets/js/theme.js"></script>
</body>
</html>
